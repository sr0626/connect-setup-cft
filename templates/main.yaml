AWSTemplateFormatVersion: "2010-09-09"
Description: "Parent template for Amazon Connect setup with Kinesis streaming and Lambda processing"

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: "S3 bucket where Lambda deployment packages are stored"

  EnableKinesisStreams:
    Type: String
    AllowedValues:
      - true
      - false
    Default: true
    Description: "Enable Kinesis streams for Contact Trace Records and Agent Events"

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Lambda Configuration"
        Parameters:
          - LambdaCodeBucket
      - Label:
          default: "Kinesis Configuration"
        Parameters:
          - EnableKinesisStreams

Conditions:
  CreateKinesisStreams: !Equals [!Ref EnableKinesisStreams, true]

Resources:
#####################################################
# IAM Role Stack
#####################################################
  IAMStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${LambdaCodeBucket}/templates/stacks/iam-role.yaml'
      Tags:
        - Key: Application
          Value: AmazonConnect

#####################################################
# Storage Stack (S3 + KMS)
#####################################################
  StorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${LambdaCodeBucket}/templates/stacks/storage.yaml'
      Tags:
        - Key: Application
          Value: AmazonConnect

#####################################################
# Kinesis Streams Stack
#####################################################
  KinesisStack:
    Condition: CreateKinesisStreams
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${LambdaCodeBucket}/templates/stacks/kinesis-streams.yaml'
      Tags:
        - Key: Application
          Value: AmazonConnect

#####################################################
# Lambda Functions Stack
#####################################################
  LambdaStack:
    Condition: CreateKinesisStreams
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - IAMStack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${LambdaCodeBucket}/templates/stacks/lambdas.yaml'
      Parameters:
        LambdaCodeBucket: !Ref LambdaCodeBucket
        LambdaExecutionRoleArn: !GetAtt IAMStack.Outputs.LambdaExecutionRoleArn
        CTRStreamArn: !GetAtt KinesisStack.Outputs.CTRStreamArn
        AgentEventStreamArn: !GetAtt KinesisStack.Outputs.AgentEventStreamArn
      Tags:
        - Key: Application
          Value: AmazonConnect

#####################################################
# Connect Instance Stack
#####################################################
  ConnectStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - StorageStack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${LambdaCodeBucket}/templates/stacks/connect-instance.yaml'
      Parameters:
        S3BucketName: !GetAtt StorageStack.Outputs.S3BucketName
        KmsKeyArn: !GetAtt StorageStack.Outputs.KmsKeyArn
        EnableKinesisStreams: !Ref EnableKinesisStreams
        CTRStreamArn: !If [CreateKinesisStreams, !GetAtt KinesisStack.Outputs.CTRStreamArn, ""]
        AgentEventStreamArn: !If [CreateKinesisStreams, !GetAtt KinesisStack.Outputs.AgentEventStreamArn, ""]
      Tags:
        - Key: Application
          Value: AmazonConnect

Outputs:
  ConnectInstanceArn:
    Description: "Amazon Connect Instance ARN"
    Value: !GetAtt ConnectStack.Outputs.ConnectInstanceArn

  ConnectInstanceAlias:
    Description: "Amazon Connect Instance Alias"
    Value: !GetAtt ConnectStack.Outputs.ConnectInstanceAlias

  CCPLoginUrl:
    Description: "Agent CCP Login URL"
    Value: !GetAtt ConnectStack.Outputs.CCPLoginUrl

  S3BucketName:
    Description: "S3 bucket for call recordings"
    Value: !GetAtt StorageStack.Outputs.S3BucketName

  CTRStreamArn:
    Condition: CreateKinesisStreams
    Description: "Contact Trace Records Kinesis Stream ARN"
    Value: !GetAtt KinesisStack.Outputs.CTRStreamArn

  AgentEventStreamArn:
    Condition: CreateKinesisStreams
    Description: "Agent Events Kinesis Stream ARN"
    Value: !GetAtt KinesisStack.Outputs.AgentEventStreamArn

  CTRProcessorLambdaArn:
    Condition: CreateKinesisStreams
    Description: "CTR Processor Lambda ARN"
    Value: !GetAtt LambdaStack.Outputs.CTRProcessorLambdaArn

  AgentEventProcessorLambdaArn:
    Condition: CreateKinesisStreams
    Description: "Agent Event Processor Lambda ARN"
    Value: !GetAtt LambdaStack.Outputs.AgentEventProcessorLambdaArn

  AdminUsername:
    Description: "Connect Admin Username"
    Value: !GetAtt ConnectStack.Outputs.AdminUsername

  AdminPasswordSecret:
    Description: "Secrets Manager secret containing admin password"
    Value: !GetAtt ConnectStack.Outputs.AdminPasswordSecretName
